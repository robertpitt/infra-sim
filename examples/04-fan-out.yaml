version: 1
name: Fan-out
description: An async Lambda publishes to an SNS topic that fans out to a queue-backed emailer (calling an external provider), an audit table and analytics.
seed: 3
nodes:
  app:
    type: common.client
    name: App
    region: eu-west
    position: {x: 80, y: 230}
    settings:
      rps: 120
      invocation: async
  place-order:
    type: aws.lambda
    name: Place order
    region: eu-west-1
    position: {x: 400, y: 230}
    settings:
      memory: 512
      duration:
        mean: 30
  order-placed:
    type: aws.sns
    name: Order placed
    region: eu-west-1
    position: {x: 720, y: 230}
  email-queue:
    type: aws.sqs
    name: Email queue
    region: eu-west-1
    position: {x: 1040, y: 80}
  emailer:
    type: aws.lambda
    name: Emailer
    region: eu-west-1
    position: {x: 1360, y: 230}
    settings:
      memory: 256
      timeout: 10 seconds
      duration:
        mean: 300
        cv: 0.6
  mail-provider:
    type: common.http-endpoint
    name: Email provider
    region: us-east
    position: {x: 1680, y: 230}
    settings:
      latency:
        mean: 250
      rateLimit: 200
  audit-log:
    type: aws.dynamodb
    name: Audit log
    region: eu-west-1
    position: {x: 1040, y: 230}
    settings:
      mode: on-demand
  analytics:
    type: aws.lambda
    name: Analytics
    region: eu-west-1
    position: {x: 1040, y: 380}
    settings:
      memory: 256
      duration:
        mean: 120
edges:
  app.out->place-order:
    to: place-order
    from: {node: app}
  place-order.out->order-placed:
    to: order-placed
    from: {node: place-order}
  order-placed.out->email-queue:
    to: email-queue
    from: {node: order-placed}
  order-placed.out->audit-log:
    to: audit-log
    from: {node: order-placed}
  order-placed.out->analytics:
    to: analytics
    from: {node: order-placed}
  email-queue.deliver->emailer:
    to: emailer
    from: {node: email-queue, port: deliver}
  emailer.out->mail-provider:
    to: mail-provider
    settings:
      retry:
        maxAttempts: 3
    from: {node: emailer}
scenarios:
  # Run in the app's Scenario tab, or: infra-sim run @fan-out --scenario mail-provider-down
  mail-provider-down:
    name: Mail provider down
    description: The external mail provider is unreachable for two minutes. Orders keep flowing and emails wait in the queue instead of being lost, but the provider's rate limit is close to normal traffic, so catching up takes three times as long as the outage did.
    duration: 11m
    warmup: 30s
    timeline:
      - at: 1m
        inject: { target: "node:mail-provider", fault: Outage, for: 2m }
        note: the mail provider goes down
      - at: 3m
        note: the mail provider is back
    assert:
      - { name: Orders keep being placed, check: "app.errorRatio < 1%" }
      - { name: Emails wait in the queue, check: "email-queue.gauge.depth:max > 5000", from: 1m, to: 3m }
      - { name: No email is lost, check: "email-queue.total.deadLettered == 0" }
      - { name: The rate limit holds back the catch-up, check: "email-queue.gauge.depth:last > 1000", from: 8m, to: 9m }
      - { name: Caught up within eight minutes of the outage ending, check: "email-queue.gauge.depth:last < 100", from: 10m, to: 11m }
