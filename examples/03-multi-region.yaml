version: 1
name: Multi-region
description: Users in the US and Europe each hit a regional stack, and both write to a ledger in us-east-1. Inject a regional outage on us-east-1, and see what cross-region calls cost.
seed: 5
nodes:
  region-us:
    type: aws.region
    name: US
    position: {x: 300, y: 0}
    size: {w: 1900, h: 300}
    settings:
      region: us-east-1
  region-eu:
    type: aws.region
    name: Europe
    position: {x: 300, y: 340}
    size: {w: 980, h: 250}
    settings:
      region: eu-west-1
  users-us:
    type: common.client
    name: Users (us-east)
    region: us-east
    position: {x: 0, y: 70}
    settings:
      rps: 150
  api-us:
    type: aws.apigateway
    name: API us-east-1
    parent: region-us
    position: {x: 330, y: 70}
    settings:
      apiType: http
  fn-us:
    type: aws.lambda
    name: Handler us-east-1
    parent: region-us
    position: {x: 660, y: 70}
    settings:
      memory: 1024
      timeout: 10 seconds
      duration:
        mean: 50
  table-us:
    type: aws.dynamodb
    name: Table us-east-1
    parent: region-us
    position: {x: 990, y: 70}
    settings:
      mode: on-demand
  users-eu:
    type: common.client
    name: Users (eu-west)
    region: eu-west
    position: {x: 0, y: 410}
    settings:
      rps: 100
  api-eu:
    type: aws.apigateway
    name: API eu-west-1
    parent: region-eu
    position: {x: 330, y: 410}
    settings:
      apiType: http
  fn-eu:
    type: aws.lambda
    name: Handler eu-west-1
    parent: region-eu
    position: {x: 660, y: 410}
    settings:
      memory: 1024
      timeout: 10 seconds
      duration:
        mean: 50
  table-eu:
    type: aws.dynamodb
    name: Table eu-west-1
    parent: region-eu
    position: {x: 990, y: 410}
    settings:
      mode: on-demand
  ledger:
    type: aws.sqs
    name: Ledger queue
    parent: region-us
    position: {x: 1320, y: 70}
  bookkeeper:
    type: aws.lambda
    name: Bookkeeper
    parent: region-us
    position: {x: 1620, y: 70}
    settings:
      memory: 512
      duration:
        mean: 80
  ledger-table:
    type: aws.dynamodb
    name: Ledger table
    parent: region-us
    position: {x: 1920, y: 70}
edges:
  users-us.out->api-us:
    to: api-us
    from: {node: users-us}
  api-us.out->fn-us:
    to: fn-us
    from: {node: api-us}
  fn-us.out->table-us:
    to: table-us
    from: {node: fn-us}
  users-eu.out->api-eu:
    to: api-eu
    from: {node: users-eu}
  api-eu.out->fn-eu:
    to: fn-eu
    from: {node: api-eu}
  fn-eu.out->table-eu:
    to: table-eu
    from: {node: fn-eu}
  fn-eu.out->ledger:
    to: ledger
    from: {node: fn-eu}
  fn-us.out->ledger:
    to: ledger
    from: {node: fn-us}
  ledger.deliver->bookkeeper:
    to: bookkeeper
    from: {node: ledger, port: deliver}
  bookkeeper.out->ledger-table:
    to: ledger-table
    from: {node: bookkeeper}
scenarios:
  # Losing us-east-1: the US stack goes down, and Europe with it, because its handler writes to the US ledger
  # synchronously. (To fix the design, make the ledger write asynchronous or give Europe its own ledger, then flip the
  # second assertion to `< 1%`.) Run it in the app's Scenario tab, or: infra-sim run @multi-region --scenario lose-us-east-1
  lose-us-east-1:
    name: Lose us-east-1
    description: Lose the US region for two minutes and see who notices. Europe goes down with it, because its handler writes to the US ledger synchronously.
    seed: 5
    duration: 6m
    warmup: 30s
    timeline:
      - at: 2m
        inject: { target: "region:aws:us-east-1", fault: Outage, for: 2m }
        note: us-east-1 goes down
      - at: 4m
        note: us-east-1 is back
    assert:
      - { name: US users see the outage, check: "users-us.errorRatio > 90%", from: 2m30s, to: 4m }
      - { name: Europe is dragged down by its synchronous ledger write, check: "users-eu.errorRatio > 90%", from: 2m30s, to: 4m }
      - { name: Both recover afterwards, check: "system.errorRatio < 2%", from: 5m }
