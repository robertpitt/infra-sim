version: 1
name: Retry storm
description: Every layer retries, and the payment provider pushes back. Watch gateway timeouts, orphaned Lambda work and retries multiply the load.
seed: 21
nodes:
  clients:
    type: common.client
    name: Mobile clients
    region: us-east
    position: {x: 80, y: 80}
    settings:
      rps: 60
      spike:
        multiplier: 3
        start: 40 seconds
        duration: 20 seconds
  api:
    type: aws.apigateway
    name: Checkout API
    position: {x: 400, y: 80}
    settings:
      integrationTimeout: 4 seconds
  checkout:
    type: aws.lambda
    name: Checkout
    position: {x: 720, y: 80}
    settings:
      memory: 1024
      timeout: 10 seconds
      duration:
        mean: 60
  payments:
    type: common.http-endpoint
    name: Payment provider
    region: us-east
    position: {x: 1040, y: 80}
    settings:
      latency:
        mean: 180
        cv: 0.4
      maxConcurrency: 40
      rateLimit: 150
edges:
  clients.out->api:
    to: api
    settings:
      timeout: 6 seconds
      retry:
        maxAttempts: 3
        backoff: 200 millis
    from: {node: clients}
  api.out->checkout:
    to: checkout
    from: {node: api}
  checkout.out->payments:
    to: payments
    settings:
      timeout: 3 seconds
      retry:
        maxAttempts: 3
        backoff: 100 millis
    from: {node: checkout}
