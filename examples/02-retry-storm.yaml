version: 1
name: Retry storm
description: Every layer retries, and the payment provider pushes back. Watch gateway timeouts, orphaned Lambda work and retries multiply the load.
seed: 21
nodes:
  clients:
    type: common.client
    name: Mobile clients
    region: us-east
    position: {x: 80, y: 80}
    settings:
      rps: 60
      spike:
        multiplier: 3
        start: 40 seconds
        duration: 20 seconds
  api:
    type: aws.apigateway
    name: Checkout API
    position: {x: 400, y: 80}
    settings:
      integrationTimeout: 4 seconds
  checkout:
    type: aws.lambda
    name: Checkout
    position: {x: 720, y: 80}
    settings:
      memory: 1024
      timeout: 10 seconds
      duration:
        mean: 60
  payments:
    type: common.http-endpoint
    name: Payment provider
    region: us-east
    position: {x: 1040, y: 80}
    settings:
      latency:
        mean: 180
        cv: 0.4
      maxConcurrency: 40
      rateLimit: 150
edges:
  clients.out->api:
    to: api
    settings:
      timeout: 6 seconds
      retry:
        maxAttempts: 3
        backoff: 200 millis
    from: {node: clients}
  api.out->checkout:
    to: checkout
    from: {node: api}
  checkout.out->payments:
    to: payments
    settings:
      timeout: 3 seconds
      retry:
        maxAttempts: 3
        backoff: 100 millis
    from: {node: checkout}
scenarios:
  # Run in the app's Scenario tab, or: infra-sim run @retry-storm --scenario slow-payments
  slow-payments:
    name: Payments slow down
    description: The payment provider takes 3 s longer for a minute. Calls now outlast the gateway's 4 s timeout, every layer retries what timed out, and the provider gets several times the calls users send, just when it can least take them.
    duration: 4m
    warmup: 30s
    overrides:
      nodes:
        clients: { spike: { multiplier: 1 } }   # the example's own spike would blur the picture
    timeline:
      - at: 1m
        inject: { target: "node:payments", fault: "Slow(3s)", for: 1m }
        note: payments slow down
      - at: 2m
        note: payments are fast again
    assert:
      - { name: "Before, the provider gets what users send", check: "payments.rate.in < 80/s", from: 30s, to: 1m }
      - { name: Retries multiply the load on the provider, check: "payments.rate.in > 180/s", from: 1m15s, to: 2m }
      - { name: Users see the slowdown as failures, check: "clients.errorRatio > 50%", from: 1m15s, to: 2m }
      - { name: It recovers once payments are fast again, check: "clients.errorRatio < 1%", from: 3m }
