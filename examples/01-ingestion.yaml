edges:
  sdk-page-loads.out->sdk-cdn:
    from: { node: sdk-page-loads }
    to: sdk-cdn
    settings:
      request: { operation: read }
  sdk-cdn.out->sdk-assets:
    from: { node: sdk-cdn }
    to: sdk-assets
    settings:
      originType: s3
      request: { operation: read }
  browser-sdk.out->collect-api:
    from: { node: browser-sdk }
    to: collect-api
    settings:
      timeout: 10 seconds
      retry: { maxAttempts: 3, backoff: 200 millis }
  server-sdk.out->collect-api:
    from: { node: server-sdk }
    to: collect-api
    settings:
      timeout: 10 seconds
      retry: { maxAttempts: 3, backoff: 500 millis }
  collect-api.authorizer->write-key-authorizer:
    from: { node: collect-api, port: authorizer }
    to: write-key-authorizer
  write-key-authorizer.out->workspaces:
    from: { node: write-key-authorizer }
    to: workspaces
    settings:
      request: { operation: read }
  collect-api.out->collect:
    from: { node: collect-api }
    to: collect
  collect.out->dedup-keys:
    from: { node: collect }
    to: dedup-keys
  collect.out->events-topic:
    from: { node: collect }
    to: events-topic
  partner-webhooks.out->webhook-api:
    from: { node: partner-webhooks }
    to: webhook-api
    settings:
      timeout: 15 seconds
      retry: { maxAttempts: 5, backoff: 1 second }
  webhook-api.out->webhook-receiver:
    from: { node: webhook-api }
    to: webhook-receiver
  webhook-receiver.out->events-topic:
    from: { node: webhook-receiver }
    to: events-topic
  bulk-uploads.out->landing:
    from: { node: bulk-uploads }
    to: landing
    settings:
      timeout: 5 minutes
  landing.events->file-splitter:
    from: { node: landing, port: events }
    to: file-splitter
    settings:
      eventTypes: created
  file-splitter.out->events-topic:
    from: { node: file-splitter }
    to: events-topic
  events-topic.out->warehouse-queue:
    from: { node: events-topic }
    to: warehouse-queue
    settings:
      rawMessageDelivery: true
  events-topic.out->realtime-queue:
    from: { node: events-topic }
    to: realtime-queue
    settings:
      rawMessageDelivery: true
      filterMatch: 0.4
  events-topic.out->destinations-queue:
    from: { node: events-topic }
    to: destinations-queue
    settings:
      rawMessageDelivery: true
      filterMatch: 0.3
  warehouse-queue.deliver->batch-writer:
    from: { node: warehouse-queue, port: deliver }
    to: batch-writer
    settings:
      batchSize: 200
      batchWindow: 5 seconds
      maxConcurrency: 20
  warehouse-queue.dlq->warehouse-dlq:
    from: { node: warehouse-queue, port: dlq }
    to: warehouse-dlq
  batch-writer.out->lake:
    from: { node: batch-writer }
    to: lake
    settings:
      request: { operation: write, payload: 400 }
  realtime-queue.deliver->enricher:
    from: { node: realtime-queue, port: deliver }
    to: enricher
    settings:
      batchSize: 10
      maxConcurrency: 30
  realtime-queue.dlq->realtime-dlq:
    from: { node: realtime-queue, port: dlq }
    to: realtime-dlq
  enricher.out->profiles:
    from: { node: enricher }
    to: profiles
  profiles.stream->profile-sync:
    from: { node: profiles, port: stream }
    to: profile-sync
    settings:
      batchSize: 100
      batchWindow: 1 second
  profile-sync.out->search-index:
    from: { node: profile-sync }
    to: search-index
  destinations-queue.deliver->forwarder:
    from: { node: destinations-queue, port: deliver }
    to: forwarder
    settings:
      batchSize: 10
      maxConcurrency: 20
  destinations-queue.dlq->destinations-dlq:
    from: { node: destinations-queue, port: dlq }
    to: destinations-dlq
  forwarder.out->nat:
    from: { node: forwarder }
    to: nat
  nat.out->crm-api:
    from: { node: nat }
    to: crm-api
    settings:
      weight: 0.6
      timeout: 5 seconds
  nat.out->ads-api:
    from: { node: nat }
    to: ads-api
    settings:
      weight: 0.4
      timeout: 5 seconds
  analysts.out->query-api:
    from: { node: analysts }
    to: query-api
    settings:
      timeout: 30 seconds
      request: { operation: read }
  query-api.out->query-service:
    from: { node: query-api }
    to: query-service
  query-service.out->s3-endpoint:
    from: { node: query-service }
    to: s3-endpoint
  query-service.out->dynamodb-endpoint:
    from: { node: query-service }
    to: dynamodb-endpoint
  s3-endpoint.out->lake:
    from: { node: s3-endpoint }
    to: lake
    settings:
      request: { operation: read, payload: 200 }
  dynamodb-endpoint.out->profiles:
    from: { node: dynamodb-endpoint }
    to: profiles
    settings:
      request: { operation: read }
  export-schedule.out->export-job:
    from: { node: export-schedule }
    to: export-job
  export-job.out->lake:
    from: { node: export-job }
    to: lake
    settings:
      request: { operation: read, payload: 5000 }
  export-job.out->exports:
    from: { node: export-job }
    to: exports
    settings:
      request: { operation: write, payload: 5000 }
  export-job.out->notify:
    from: { node: export-job }
    to: notify
controllers:
  collect-provisioned:
    type: core.target-tracking
    target: collect
    name: Provisioned concurrency autoscaling
    settings:
      metric: concurrent
      per: unit
      targetValue: 0.7
      setting: provisioned
      min: 10
      max: 200
scenarios:
  launch:
    name: Product launch
    description: Four times the SDK traffic for three minutes. The collect function's provisioned concurrency follows the load (and keeps it for the five-minute scale-in cooldown afterwards), the queues absorb the burst, and nobody sees an error.
    duration: 8m
    warmup: 30s
    timeline:
      - at: 2m
        note: SDK traffic quadruples
        set:
          node: browser-sdk
          settings:
            rps: 880
      - at: 5m
        note: back to normal
        set:
          node: browser-sdk
          settings:
            rps: 220
    assert:
      - check: browser-sdk.errorRatio < 0.1%
        name: Nobody sees an error
        from: 2m
        to: 5m
      - check: browser-sdk.latency.p99 < 300ms
        name: Latency holds
        from: 2m
        to: 5m
      - check: collect.gauge.provisioned:max <= 25
        name: Before the launch, little provisioned concurrency
        from: 30s
        to: 2m
      - check: collect.gauge.provisioned:max >= 40
        name: Provisioned concurrency follows the load
        from: 2m
        to: 5m
      - check: collect.gauge.provisioned:last >= 40
        name: It is kept for the scale-in cooldown, and paid for
        from: 7m30s
      - check: warehouse-queue.gauge.depth:last < 100
        name: The lake keeps up
        from: 7m
  crm-outage:
    name: CRM destination down
    description: The CRM's API is down for five minutes. Ingestion doesn't notice, but its events give up after four tries thirty seconds apart, shorter than the outage, and end in the dead-letter queue. And because a batch fails as a whole, the healthy ads API gets its events several times over. Partial batch responses (reportBatchItemFailures) would spare it.
    duration: 10m
    warmup: 30s
    timeline:
      - at: 1m
        note: the CRM's API goes down
        inject:
          target: node:crm-api
          fault: Outage
          for: 5m
      - at: 6m
        note: the CRM is back
    assert:
      - check: system.errorRatio < 0.1%
        name: Ingestion doesn't notice
      - check: destinations-queue.total.deadLettered > 5000
        name: Events give up and are dead-lettered
        from: 1m
        to: 7m
      - check: ads-api.rate.in < 40/s
        name: Before, the ads API gets its share
        from: 30s
        to: 1m
      - check: ads-api.rate.in > 60/s
        name: During, it gets duplicates of whole batches
        from: 2m
        to: 6m
      - check: destinations-queue.gauge.depth:last < 50
        name: Afterwards the queue is clear
        from: 9m
  profiles-throttled:
    name: Profiles table under-provisioned
    description: The profiles table switched to provisioned capacity with 60 write units, for about a hundred writes a second. The enricher is throttled, failed batches are retried and then dead-lettered, and the search index falls behind, while ingestion carries on untouched.
    duration: 8m
    warmup: 30s
    overrides:
      nodes:
        profiles:
          mode: provisioned
          writeCapacity: 60
          readCapacity: 200
    assert:
      - check: profiles.rate.fail.Throttled > 20/s
        name: Profile writes are throttled
      - check: realtime-queue.gauge.oldestAgeMs:max > 30s
        name: Updates wait
      - check: realtime-queue.total.deadLettered > 5000
        name: Updates are dead-lettered
      - check: search-index.rate.in < 60/s
        name: The search index falls behind
      - check: browser-sdk.errorRatio < 0.1%
        name: Ingestion is untouched
