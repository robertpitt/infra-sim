# yaml-language-server: $schema=../schema/design.schema.json
version: 1
name: Event ingestion platform
description: |-
  A customer-data platform that takes in events from browser and mobile SDKs, server SDKs, partner webhooks and bulk file uploads, fans them out to a data lake, real-time customer profiles and third-party destinations, and serves analysts through a cached query API. About forty-five components in one region, with a VPC.

  How it is wired: a collect API (HTTP API with a write-key authorizer) runs a Lambda that records an idempotency key in DynamoDB and publishes to an SNS topic. The topic fans out, through filter policies, to three SQS queues, each with its own dead-letter queue: a batch writer that lands events in the lake in S3, an enricher that updates customer profiles in DynamoDB (whose stream keeps a search index in step), and a forwarder in the VPC that calls the destinations' APIs through a NAT gateway. Bulk uploads land in S3 and are split by a Lambda the bucket's notifications invoke. Page loads fetch the SDK from CloudFront. Analysts query a REST API with a cache, in front of a query handler in the VPC that reaches S3 and DynamoDB through gateway endpoints. The collect function's provisioned concurrency follows its load, as Application Auto Scaling keeps it near 70% in use. A scheduled job exports the lake and emails that the export is ready.

  What the simulator cannot show: a stream service (Kinesis or Firehose in front of the lake is modelled as SNS and SQS), a file being split into many events (a bulk file is one message, and a batch written to the lake counts as its events, not as one object), the query engine's own cost (Athena, Redshift: the query handler stands in for it), and OpenSearch, which is an HTTP endpoint here. The scheduled export is a client firing every five minutes, standing in for EventBridge.
seed: 11
