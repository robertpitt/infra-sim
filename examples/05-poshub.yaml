# yaml-language-server: $schema=../schema/design.schema.json
version: 1
name: POS Hub
description: |-
  The whole POS Hub stack from falcon/cdk/services/pos-hub: REST API with its Lambda authorizer, 28 tables, the change-event bus with webhooks, search, menu and delivery consumers, the delayed-task scheduler, billing, reports, email and the media CDN. What is stood in for or left out is listed at the end of this description.

  POS Hub, mapped from `falcon/cdk/services/pos-hub` (the CDK stacks and the Lambda runtime they deploy) into one design. The
  hand-mapping works from the CDK stacks as far as they were read; the rest (traffic, handler durations, anything marked
  "assumed") is an assumption you should replace with production numbers.

  What is modelled: the REST API, its request authorizer and its single handler Lambda, all 28 DynamoDB tables (with their
  global secondary indexes and, on 19 of them, a real DynamoDB Stream), the three S3 buckets and the assets bucket's
  notification, the table-change pipeline (streams -> store-change-handler -> SNS event bus -> its six subscribers), outbound
  webhooks, the delayed-task scheduler (stream, queue, handlers), billing, performance reports, report generation, image
  processing, SES email, a CloudFront distribution in front of the media bucket, and the external HTTP services the runtime
  calls. Everything AWS sits inside one `aws.region` box (eu-west-1); callers and external services sit outside it.

  Where the simulator has no component for something the stack uses, this file follows two rules:

    1. A service that only RECEIVES work (OpenSearch, SSM) is left out. The time it costs is folded into the calling
       Lambda's handler duration and the call is not drawn. See the list at the end of this description.
    2. A service that only STARTS work (EventBridge schedules, CloudWatch Logs subscription filters) is replaced by a
       `common.client` whose `origin.source` is "approximation", firing at the real rate.

  Every node carries `origin` (the CDK file and construct id, or "assumed" with what is assumed), so an importer could re-run
  and merge by id.

  Numbers that come from the CDK (memory, timeouts, batch sizes, batching windows, visibility timeouts, retention, redrive
  counts, concurrency caps, FIFO, schedules) are exact. Numbers that do not (handler durations, traffic rates, the route
  mix, external latencies, the region) are ASSUMPTIONS, marked "assumed". Change them to match production. A handler
  duration is the time at 1,769 MB or more; the Lambda component stretches it for smaller memory sizes (about 7x at the
  128 MB the CDK leaves on several of these functions).

  Assumptions added with the newer service components (each is `origin: assumed` on its node or edge, or stated here):

    - DYNAMODB STREAMS. The CDK says change capture feeds store-change-handler from 18 tables and the scheduler stream handler
      from the scheduler table; it is not in hand which 18. The design captures orders, orders-association, invitations,
      reports, deliveries, invoices, locations, accounts, users, applications, connections, menus, menu-categories,
      menu-items, catalog-products, catalog-categories, catalog-modifiers and catalog-modifier-groups. The first seven
      OpenSearch indexes (orders, deliveries, locations, accounts, users, applications, connections) are the evidence for
      those tables; the rest are a guess (edges whose table is a guess say so in their origin). Each stream edge is the event
      source mapping: batch size 100, batching window 1 second and a 10 second timeout, exactly what the retired SQS edge
      carried (the scheduler's: batch 100, 5 minutes). Retry, record age and bisect settings are left at their defaults
      (retry until the batch succeeds, as for an unset mapping) because the CDK values are not in hand, and no `discarded`
      port is wired because no failure destination is described. Records are produced by whatever writes the table, so every
      write edge to a captured table now feeds the bus.
    - GLOBAL SECONDARY INDEXES. "About 70 across the 28 tables" is all the stack says. Every table has `gsi.count` 2 or 3
      (14 of each, 70 in all): 3 for the tables the design sends the most requests to (auth, orders, locations, connections,
      audits, deliveries, applications, menus, menu-items, payments, catalog-products, users, accounts, resellers) and 2 for
      the rest. That split is a guess; the sum is the only fact. Indexes are alike here, project everything and every write
      touches every index (the component's defaults).
    - SNS FILTER POLICIES. Every event-bus subscription filters on EVENT_NAME, CHANGE_TYPE or OBJECT_TYPE; the shares are
      not known. The four low-volume subscribers (delivery auto-dispatch, image import, store cleanup, menu change) get
      `filterMatch: 0.05` (assumed, "a small share"); the webhook router and the search queue stay at 1, an upper bound. The
      shares also keep a consumer that writes a captured table from feeding itself: without them its write would emit an
      event that reaches it again.
    - API GATEWAY AUTHORIZER. The request authorizer (TokenAuthorizer, `authorizerV2.ts`, result cache TTL 0 per the stack)
      is a Lambda on the gateway's authorizer port, invoked for every request. Its memory, duration and the three table
      reads it makes (auth, memberships, roles) are assumed.
    - SES. EmailService/AmazonSESProvider sends invitations (API handler), invoice emails (process-invoice-queue) and
      performance emails (performance-report-handler). The API handler's share (weight 1, as for invitations) and one
      recipient per send are assumed; the account is out of the sandbox with the SES defaults (14 recipients a second,
      50,000 a day, recipient bounce and complaint rates), which are assumptions too. Nothing is wired to its `events` port
      because the stack as read does not say where SES events go.
    - CLOUDFRONT. The media domain and signed deliveries CSV links are served by pos-hub-cdn, a separate stack not read. The
      distribution here is a stand-in: viewers (20 requests a second, assumed) -> one CloudFront distribution (4 edge
      locations, 20,000 objects of 120 KB, popularity skew 2, a one day default TTL, regional cache on, all assumed) ->
      the assets bucket (read). Signed URLs, geo restriction and the real object count are not modelled.
    - S3 NOTIFICATION FILTER. The assets bucket notifies image-drop-handler only for keys under `media/` and only for
      creates. The edge sets `eventTypes: created` and `filter: 0.9` (assumed share of writes under `media/`: the other
      writes are exports and invoice files).

  Known accuracy limits, all consequences of the simulator rather than of the stack:

    - The API handler is one Lambda behind about 800 routes. With `fanOut: "weighted"` each request makes ONE downstream
      call, picked by the weights below, where a real request makes several. Read the table rates as the mix, and scale the
      client `rps` up for realistic per-table load. The writes the old design sent to the stand-in queues are now the weighted
      write edges to the captured tables (orders, orders-association, invitations, reports) only.
    - The scheduler stream handler's write back to the scheduler table (real: a status update) is not drawn: the simulator
      has no stream event filter, so the write would be captured and re-invoke the handler without end.
    - Audits are written by the webhook dispatcher, which runs on the event path, and the design has no stream filter, so the
      audits table is NOT captured (the real stack indexes audits in OpenSearch, so it is captured there). A captured
      audits table would feed itself.
    - Tables with replicas, the stack's reason for a stream on every table, are drawn as single-region tables.
    - S3's prefix and event-type filters are one fraction, not key matching; image-drop's own writes to thumbs/ are not drawn
      (they would invoke it again).
    - One invocation sends one message. The billing seeder (one message per account), the schedule feeder (up to 250 per
      page), and the webhook router (one per matching connection) really send many.
    - Lambda layers and IAM are not modelled.
    - The EventBridge stand-ins fire once per period (daily billing, hourly reports, 14-minute feeder): raise their `rps`
      to watch them in a short run.

  What the simulator cannot show, and why:
  - S3 (partly) (left out): The three buckets are drawn, but not every object path: presigned downloads (reports, deliveries CSV, images) are served by S3 to the caller without touching the API, thumbs/ writes by image-drop-handler, multipart uploads, lifecycle expiry (1 day exports, 30 day backups).
  - OpenSearch (left out): The poshub-orders, -deliveries, -locations, -accounts, -users, -applications, -connections and -audits indexes. Written by opensearch-ingress and reindex-handler; read by the API's search and metrics endpoints and by the performance report.
  - SES (partly): Sends from the three Lambdas are modelled against an assumed account. Not modelled: sender identities and templates, the reseller's custom SMTP provider, and where SES delivery, bounce and complaint events go.
  - SSM Parameter Store (left out): JWT signing key, CloudFront signing key pair for deliveries CSV links, Twilio credentials.
  - Route 53, ACM (left out): The API custom domain and its certificates, and the CDN's domain.
  - CloudFront (assumed stand-in): The real CDN is the separate pos-hub-cdn stack, not read. The distribution, its traffic and cache settings are assumed; signed URLs and behaviours by path are not modelled.
  - EventBridge (approximated): Three schedule rules: scheduleFeedHandlerRule (every 14 min), seedInvoiceQueueRule (daily 00:00), hourlyScheduleRule (hourly). Each is a constant-rate client.
  - DynamoDB Streams (partly assumed): Modelled with a real stream per captured table. Which 18 tables, the retry and bisect settings, the audits table, the scheduler handler's write-back, event filters and a failure destination are covered in the notes above.
  - CloudWatch Logs subscription filter (approximated): BAD_REQUEST_BODY lines in the API access log invoking validation-failure-consumer. A constant-rate client.
  - DynamoDB global tables (left out): Cross-region replication, which the stack says is why every table has a stream. The regions are not named, so no replica tables are drawn.
  - GSIs (assumed): 70 indexes spread 3 or 2 per table; the real distribution, key shapes and any index with its own capacity are not known.
  - SNS subscription filter policies (assumed): Shares for four subscribers are guesses; the policies themselves (EVENT_NAME, CHANGE_TYPE, OBJECT_TYPE) are not simulated.
  - API Gateway path-based routing (simulator): A gateway has one integration port, so the /docs S3 integration is a weighted share of all requests, not a route.
  - API Gateway authorizer (assumed): The authorizer Lambda's duration, memory and reads are assumed; one invocation per request (result cache TTL 0).
  - One-to-many sends from one invocation (simulator): seed-invoices, schedule-feed-handler and webhook-router each send many messages per invocation; here one invocation sends one.
  - API Gateway request validation and gateway responses (simulator): Body and parameter validation (a source of the BAD_REQUEST_BODY audit), custom gateway responses, per-stage access logs.
  - Lambda layer, IAM roles, log groups (not runtime): ApiLambdaLayer (sharp, axios, twilio, react-pdf...), per-construct roles, 1 to 4 week log retention.
  - OpenAPI exporter and API documentation (not runtime): Custom resource and ApiDocumentation that publish the OpenAPI export and docs version at deploy time.
  - opensearch reindex-handler (not runtime): A 15 minute Lambda with no trigger, run by hand to rebuild the indexes. Also .local-opensearch-migration/ and migrations/migrate-poshub-rbac.ts.
  - pos-hub-apps (external): Named in pos-hub's own design docs as holding the apps connections table and receiving webhooks, catalog sync and menu publication. Drawn as partner-webhooks, marketplace-apps and delivery-apps.
  - pos-hub-doordash, pos-hub-grubhub (external): Marketplace adapters named in pos-hub's docs; each has its own settings table that the design docs propose to capture. Behind marketplace-apps and delivery-apps.
  - pos-hub-client (external): The dashboard front end (reseller, account, user). Drawn as the `dashboards` client.
  - Twilio (external): OTP verification and payment-link SMS. Drawn as an http-endpoint.
  - Image hosts, delegated report providers (external): Wherever product images are fetched from; the application URLs that build reports on request.
  - Other pos-hub-* and partner services (not read) (external): Directories under falcon/cdk/services that look related by name, not examined: pos-hub-cdn, -clover, -dashboard, -email, -fresh-kds, -gloriafood, -lightspeed, -lightspeed-k, -review, -shopify, -sms, -square, -whatsapp, pos-res-3700, pos-integrations, partner-api-pos-hub, partner-api-kitchenhub, partner-api-bistrohub, accounting-hub, accounting-hub-apps, fhposhubonboard.
seed: 11
scenarios:
  daily:
    name: Daily traffic
    description: |-
      A day in the life of POS Hub, with the API and its authorizer, the change-event bus and its subscribers, the delayed-task scheduler, billing, reports, email and the media CDN. The external services are assumed to be up and running.
    duration: 24 hours
    traffic:
      scale: 3
    warmup: 15 minute
